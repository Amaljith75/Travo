name: Admin dashboard (GitHub Pages)

# Builds the static admin dashboard and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/admin/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @travo/admin
      - name: Build static dashboard
        run: npm run build -w @travo/admin
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
      - run: touch apps/admin/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
