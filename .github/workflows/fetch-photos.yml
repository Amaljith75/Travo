name: Fetch place photos

# Downloads freely licensed Wikimedia photos for destinations and vehicles and commits them to the branch.
on:
  push:
    paths: ['scripts/photos/**', '.github/workflows/fetch-photos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/photos/fetch.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A assets/photos
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update place photos from Wikimedia Commons"
          git push
